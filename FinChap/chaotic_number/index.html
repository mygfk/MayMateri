<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Math Moving Numbers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
            overflow: hidden; /* Prevent scrollbars from moving numbers */
            touch-action: none; /* Prevent pinch-zoom on mobile */
        }
        
        #game-area {
            position: relative;
            width: 100%;
            height: calc(100vh - 150px); /* Leave space for controls */
            background-color: #1e293b; /* Tailwind slate-800 */
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
        }

        .number-bubble {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background-color: #3b82f6; /* Tailwind blue-500 */
            color: white;
            font-weight: bold;
            font-size: 1.25rem;
            border-radius: 50%;
            user-select: none;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            /* Transform will be handled by JS for smooth movement */
            transition: opacity 0.3s;
        }

        /* Glassmorphism for controls */
        #controls {
            backdrop-filter: blur(10px);
            background-color: rgba(30, 41, 59, 0.8);
        }

        /* Custom range slider styling */
        input[type=range] {
            accent-color: #3b82f6;
        }
        
        /* Modal styling */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 50; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            background-color: rgba(0,0,0,0.7); /* Black w/ opacity */
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: #1e293b;
            margin: 15% auto; /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #334155;
            width: 80%;
            max-width: 400px;
            border-radius: 1rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
        }
    </style>
</head>
<body class="flex flex-col h-screen p-4">

    <div id="controls" class="w-full max-w-5xl mx-auto mb-4 p-4 rounded-xl shadow-lg border border-slate-700 flex flex-col md:flex-row flex-wrap gap-4 items-start md:items-center justify-between z-10">
        
        <!-- Mode Selection -->
        <div class="flex flex-col gap-2 w-full md:w-1/5">
            <label for="mode-select" class="text-sm font-medium text-slate-300">Mode Angka:</label>
            <select id="mode-select" class="w-full bg-slate-800 text-white rounded-lg p-2 border border-slate-600 focus:outline-none focus:border-blue-500 transition-colors">
                <option value="auto">Otomatis (Trik)</option>
                <option value="custom">Input Sendiri</option>
            </select>
        </div>

        <!-- Auto Controls (Hidden/Shown based on mode) -->
        <div id="auto-controls" class="flex flex-col gap-2 w-full md:w-1/4">
            <label for="num-count" class="text-sm font-medium text-slate-300 flex justify-between">
                <span>Jumlah Angka:</span>
                <span id="num-count-display" class="text-blue-400 font-bold">15</span>
            </label>
            <input type="range" id="num-count" min="15" max="25" step="5" value="15" class="w-full">
        </div>

        <!-- Custom Controls (Hidden by default) -->
        <div id="custom-controls" class="flex flex-col gap-2 w-full md:w-1/3 hidden">
            <label for="custom-numbers" class="text-sm font-medium text-slate-300">Masukkan Angka (koma/spasi):</label>
            <textarea id="custom-numbers" rows="1" class="w-full bg-slate-800 text-white rounded-lg p-2 border border-slate-600 focus:outline-none focus:border-blue-500 transition-colors resize-none" placeholder="Contoh: 12, 34, 56"></textarea>
            <span id="custom-error" class="text-xs text-red-400 hidden">Masukkan minimal 1 angka valid!</span>
        </div>

        <!-- Color Selection -->
        <div class="flex flex-col gap-2 w-full md:w-1/6">
            <label for="color-mode" class="text-sm font-medium text-slate-300">Warna Angka:</label>
            <select id="color-mode" class="w-full bg-slate-800 text-white rounded-lg p-2 border border-slate-600 focus:outline-none focus:border-blue-500 transition-colors">
                <option value="single">1 Warna (Biru)</option>
                <option value="even_odd">2 Warna (Ganjil/Genap)</option>
                <option value="random">Warna-warni</option>
            </select>
        </div>

        <div class="flex flex-col gap-2 w-full md:w-1/5">
            <label for="speed" class="text-sm font-medium text-slate-300 flex justify-between">
                <span>Kecepatan:</span>
                <span id="speed-display" class="text-blue-400 font-bold">Sedang</span>
            </label>
            <input type="range" id="speed" min="1" max="10" step="1" value="5" class="w-full">
        </div>

        <div class="flex gap-2 w-full md:w-auto mt-2 md:mt-0 flex-wrap items-end">
            <button id="start-btn" class="flex-1 md:flex-none px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg shadow-md transition-colors duration-200">
                Mulai Game
            </button>
            <button id="stop-btn" class="flex-1 md:flex-none px-6 py-2 bg-red-600 hover:bg-red-500 text-white font-semibold rounded-lg shadow-md transition-colors duration-200 hidden">
                Berhenti
            </button>
            <button id="answer-btn" class="flex-1 md:flex-none px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg shadow-md transition-colors duration-200 hidden">
                Lihat Jawaban
            </button>
            <button id="reset-btn" class="flex-1 md:flex-none px-6 py-2 bg-slate-600 hover:bg-slate-500 text-white font-semibold rounded-lg shadow-md transition-colors duration-200 hidden">
                Reset
            </button>
        </div>
    </div>

    <div id="game-wrapper" class="w-full max-w-6xl mx-auto flex-grow relative rounded-xl border border-slate-700">
        <div id="game-area">
            <!-- Numbers will be injected here by JS -->
            <div id="placeholder-text" class="absolute inset-0 flex items-center justify-center text-slate-500 text-lg text-center p-4">
                Atur jumlah angka dan kecepatan, lalu klik "Mulai Game".<br>Jumlahkan semua angka yang muncul!
            </div>
        </div>
    </div>

    <div id="answer-modal" class="modal">
        <div class="modal-content">
            <h2 class="text-2xl font-bold text-white mb-4">Hasil Penjumlahan</h2>
            <div class="text-6xl font-black text-emerald-400 mb-6 drop-shadow-md" id="final-answer">0</div>
            <p class="text-slate-300 mb-6 text-sm" id="answer-details">
                Menghitung...
            </p>
            <button id="close-modal-btn" class="w-full px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-lg transition-colors duration-200">
                Tutup
            </button>
        </div>
    </div>

    <script>
        // State variables
        let isPlaying = false;
        let animationFrameId;
        let numbersData = []; // Store position, velocity, and value of each number
        let totalSum = 0;
        let currentTargetSum = 70; // Target sum for pairs

        // DOM Elements
        const gameArea = document.getElementById('game-area');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const answerBtn = document.getElementById('answer-btn');
        const resetBtn = document.getElementById('reset-btn');
        
        const modeSelect = document.getElementById('mode-select');
        const autoControls = document.getElementById('auto-controls');
        const customControls = document.getElementById('custom-controls');
        const customNumbersInput = document.getElementById('custom-numbers');
        const customError = document.getElementById('custom-error');

        const numCountInput = document.getElementById('num-count');
        const numCountDisplay = document.getElementById('num-count-display');
        const speedInput = document.getElementById('speed');
        const speedDisplay = document.getElementById('speed-display');
        const colorModeSelect = document.getElementById('color-mode');
        const placeholderText = document.getElementById('placeholder-text');
        
        // Modal Elements
        const modal = document.getElementById('answer-modal');
        const finalAnswerDisplay = document.getElementById('final-answer');
        const answerDetailsDisplay = document.getElementById('answer-details');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // Update labels on range change
        numCountInput.addEventListener('input', (e) => {
            numCountDisplay.textContent = e.target.value;
        });

        speedInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            let text = 'Sedang';
            if (val <= 3) text = 'Lambat';
            else if (val >= 8) text = 'Cepat';
            speedDisplay.textContent = text;
        });

        // Toggle between Auto and Custom mode
        modeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                autoControls.classList.add('hidden');
                customControls.classList.remove('hidden');
            } else {
                autoControls.classList.remove('hidden');
                customControls.classList.add('hidden');
            }
            customError.classList.add('hidden'); // Sembunyikan error saat ganti mode
        });

        startBtn.addEventListener('click', startGame);
        stopBtn.addEventListener('click', stopGame);
        answerBtn.addEventListener('click', showAnswer);
        resetBtn.addEventListener('click', resetGame);
        closeModalBtn.addEventListener('click', () => modal.style.display = 'none');

        // Close modal if clicked outside
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        function generateNumbersList(count) {
            const list = [];
            totalSum = 0;
            // Generate pairs that sum to currentTargetSum (e.g., 70)
            const numPairs = Math.floor(count / 2);
            let usedNumbers = new Set();

            for (let i = 0; i < numPairs; i++) {
                let num1, num2;
                let attempts = 0;
                do {
                    // Pick a random number between 11 and (currentTargetSum - 11)
                    // Try to avoid ending in 0 or 5 if possible, but don't loop forever
                    num1 = Math.floor(Math.random() * (currentTargetSum - 22)) + 11;
                    num2 = currentTargetSum - num1;
                    attempts++;
                    // If we can't find unique non-0/5 after many attempts, relax constraints
                } while (
                    (usedNumbers.has(num1) || usedNumbers.has(num2) || num1 === num2 || 
                     (attempts < 20 && (num1 % 5 === 0 || num2 % 5 === 0))) && 
                    attempts < 50
                );

                list.push(num1, num2);
                usedNumbers.add(num1);
                usedNumbers.add(num2);
            }

            // If count is odd (15, 25), add one leftover number
            if (count % 2 !== 0) {
                let leftover;
                let attempts = 0;
                do {
                    leftover = Math.floor(Math.random() * 40) + 11; // Random 2 digit
                    attempts++;
                } while (usedNumbers.has(leftover) && attempts < 20);
                list.push(leftover);
            }

            // Shuffle the list
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }

            // Calculate exact total
            totalSum = list.reduce((a, b) => a + b, 0);
            
            return {
                list: list,
                pairs: numPairs,
                target: currentTargetSum,
                leftover: count % 2 !== 0 ? list[list.length - 1] : 0 // approx, technically it could have been shuffled
            };
        }

        function startGame() {
            if (isPlaying) return;
            
            // Validate custom input before starting
            let customNumbersArray = [];
            if (modeSelect.value === 'custom') {
                const rawInput = customNumbersInput.value;
                // Parse input: pisah dengan koma atau spasi, ubah ke angka, filter yang bukan angka
                customNumbersArray = rawInput.split(/[\s,]+/).map(n => parseInt(n)).filter(n => !isNaN(n));
                
                if (customNumbersArray.length === 0) {
                    customError.classList.remove('hidden');
                    return; // Hentikan proses jika kosong atau tidak valid
                }
                customError.classList.add('hidden');
            }

            isPlaying = true;
            gameArea.innerHTML = ''; // Clear area
            numbersData = [];
            
            // Toggle buttons
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            answerBtn.classList.add('hidden');
            resetBtn.classList.remove('hidden');
            
            // Disable inputs while playing
            numCountInput.disabled = true;
            speedInput.disabled = true;
            modeSelect.disabled = true;
            customNumbersInput.disabled = true;
            colorModeSelect.disabled = true;

            let numbers = [];
            let detailsHtml = '';

            // Tentukan sumber angka berdasarkan mode yang dipilih
            if (modeSelect.value === 'auto') {
                const count = parseInt(numCountInput.value);
                const generationData = generateNumbersList(count);
                numbers = generationData.list;

                detailsHtml = `Angka-angka ini dirancang berpasangan menjadi <strong>${generationData.target}</strong>.<br>`;
                detailsHtml += `Ada ${generationData.pairs} pasang (${generationData.pairs} x ${generationData.target} = ${generationData.pairs * generationData.target}).<br>`;
                if (count % 2 !== 0) {
                    const leftoverVal = totalSum - (generationData.pairs * generationData.target);
                    detailsHtml += `Sisa 1 angka tidak berpasangan: ${leftoverVal}.<br>`;
                }
                detailsHtml += `Total: <strong>${totalSum}</strong>`;
            } else {
                numbers = customNumbersArray;
                totalSum = numbers.reduce((a, b) => a + b, 0);
                detailsHtml = `Kamu menggunakan input angka manual sebanyak <strong>${numbers.length}</strong> angka.<br>`;
                detailsHtml += `Penjumlahan murni dari angka-angka yang kamu masukkan.<br>`;
                detailsHtml += `Total: <strong>${totalSum}</strong>`;
            }

            // Set teks penjelasan pada modal
            answerDetailsDisplay.innerHTML = detailsHtml;

            // Generate elements
            const areaWidth = gameArea.clientWidth;
            const areaHeight = gameArea.clientHeight;
            const bubbleSize = 50;

            const baseSpeed = parseInt(speedInput.value); // 1 to 10
            const selectedColorMode = colorModeSelect.value;

            numbers.forEach((val, index) => {
                const el = document.createElement('div');
                el.className = 'number-bubble';
                
                // Setel Warna berdasarkan pilihan mode warna
                if (selectedColorMode === 'single') {
                    el.style.backgroundColor = '#3b82f6'; // Biru bawaan
                } else if (selectedColorMode === 'even_odd') {
                    // Genap = Biru, Ganjil = Merah
                    el.style.backgroundColor = (val % 2 === 0) ? '#3b82f6' : '#ef4444'; 
                } else if (selectedColorMode === 'random') {
                    // Berbagai macam warna cerah Tailwind
                    const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6'];
                    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                }

                // Sesuaikan ukuran font jika user memasukkan angka yang panjang (ratusan/ribuan)
                if (val.toString().length > 3) {
                    el.style.fontSize = '0.8rem';
                } else if (val.toString().length > 2) {
                    el.style.fontSize = '1rem';
                }

                el.textContent = val;
                
                // Random starting position (pastikan tetap di dalam layar)
                const x = Math.random() * (Math.max(1, areaWidth - bubbleSize));
                const y = Math.random() * (Math.max(1, areaHeight - bubbleSize));
                
                // Random velocity based on speed slider
                const speedMultiplier = (baseSpeed * 0.5) + 0.5; 
                let vx = (Math.random() - 0.5) * 4 * speedMultiplier;
                let vy = (Math.random() - 0.5) * 4 * speedMultiplier;
                
                if (Math.abs(vx) < 0.5) vx = vx < 0 ? -1 : 1;
                if (Math.abs(vy) < 0.5) vy = vy < 0 ? -1 : 1;

                el.style.transform = `translate(${x}px, ${y}px)`;
                
                gameArea.appendChild(el);

                numbersData.push({
                    el: el,
                    x: x,
                    y: y,
                    vx: vx,
                    vy: vy,
                    size: bubbleSize,
                    value: val
                });
            });

            // Start animation loop
            lastTime = performance.now();
            animationFrameId = requestAnimationFrame(animate);
        }

        function stopGame() {
            if (!isPlaying) return;
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);

            // Toggle buttons
            stopBtn.classList.add('hidden');
            startBtn.classList.remove('hidden');
            startBtn.textContent = "Ulangi Game";
            answerBtn.classList.remove('hidden'); 
            
            // Add a visual effect to show they stopped
            numbersData.forEach(data => {
                data.el.style.boxShadow = "0 0 15px 5px rgba(255, 255, 255, 0.4)"; // White glow
                data.el.style.transition = "transform 0.5s ease-out, box-shadow 0.3s";
            });
        }

        function resetGame() {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            
            // Kembalikan ke tampilan teks awal
            gameArea.innerHTML = `
                <div id="placeholder-text" class="absolute inset-0 flex items-center justify-center text-slate-500 text-lg text-center p-4">
                    Atur jumlah angka dan kecepatan, lalu klik "Mulai Game".<br>Jumlahkan semua angka yang muncul!
                </div>
            `;
            numbersData = [];
            
            // Reset state tombol
            startBtn.classList.remove('hidden');
            startBtn.textContent = "Mulai Game";
            stopBtn.classList.add('hidden');
            answerBtn.classList.add('hidden');
            resetBtn.classList.add('hidden');
            
            // Enable kembali semua input
            numCountInput.disabled = false;
            speedInput.disabled = false;
            modeSelect.disabled = false;
            customNumbersInput.disabled = false;
            colorModeSelect.disabled = false;
        }

        function showAnswer() {
            finalAnswerDisplay.textContent = totalSum;
            modal.style.display = "block";
        }

        let lastTime = 0;
        function animate(currentTime) {
            if (!isPlaying) return;

            // Calculate delta time for smooth movement regardless of frame rate
            const deltaTime = (currentTime - lastTime) / 16.66; // Normalize to approx 60fps
            lastTime = currentTime;

            const areaWidth = gameArea.clientWidth;
            const areaHeight = gameArea.clientHeight;

            // Update positions
            for (let i = 0; i < numbersData.length; i++) {
                let p = numbersData[i];

                p.x += p.vx * deltaTime;
                p.y += p.vy * deltaTime;

                // Wall collisions (Bounce)
                if (p.x <= 0) {
                    p.x = 0;
                    p.vx *= -1;
                } else if (p.x >= areaWidth - p.size) {
                    p.x = areaWidth - p.size;
                    p.vx *= -1;
                }

                if (p.y <= 0) {
                    p.y = 0;
                    p.vy *= -1;
                } else if (p.y >= areaHeight - p.size) {
                    p.y = areaHeight - p.size;
                    p.vy *= -1;
                }
                
                // Apply new position
                p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
            }

            // Optional: Simple Circle Collision between bubbles (can get computationally heavy with many)
            // Kept simple for 25 items, it's fine.
            for (let i = 0; i < numbersData.length; i++) {
                for (let j = i + 1; j < numbersData.length; j++) {
                    let p1 = numbersData[i];
                    let p2 = numbersData[j];
                    
                    // Center points
                    let c1x = p1.x + p1.size / 2;
                    let c1y = p1.y + p1.size / 2;
                    let c2x = p2.x + p2.size / 2;
                    let c2y = p2.y + p2.size / 2;

                    let dx = c2x - c1x;
                    let dy = c2y - c1y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < p1.size) { // Radius is size/2, so r1+r2 = size
                        // Simple elastic bounce
                        let angle = Math.atan2(dy, dx);
                        let sin = Math.sin(angle);
                        let cos = Math.cos(angle);

                        // Velocity components along the collision axis
                        let v1n = p1.vx * cos + p1.vy * sin;
                        let v2n = p2.vx * cos + p2.vy * sin;

                        // Swap normal velocities (assuming equal mass)
                        let temp = v1n;
                        v1n = v2n;
                        v2n = temp;

                        // Reconstruct x and y velocities
                        let v1t = p1.vy * cos - p1.vx * sin; // Tangential remains same
                        let v2t = p2.vy * cos - p2.vx * sin;

                        p1.vx = v1n * cos - v1t * sin;
                        p1.vy = v1n * sin + v1t * cos;
                        p2.vx = v2n * cos - v2t * sin;
                        p2.vy = v2n * sin + v2t * cos;
                        
                        // Push them apart slightly to prevent sticking
                        let overlap = p1.size - distance;
                        p1.x -= (overlap/2) * cos;
                        p1.y -= (overlap/2) * sin;
                        p2.x += (overlap/2) * cos;
                        p2.y += (overlap/2) * sin;
                    }
                }
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if (!isPlaying && numbersData.length > 0) {
                // If stopped, just ensure they stay within bounds visually
                const areaWidth = gameArea.clientWidth;
                const areaHeight = gameArea.clientHeight;
                numbersData.forEach(p => {
                    if (p.x > areaWidth - p.size) p.x = areaWidth - p.size;
                    if (p.y > areaHeight - p.size) p.y = areaHeight - p.size;
                    p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
                });
            }
        });
    </script>
</body>
</html>
