<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Custom Icosahedron Engine</title>
    <!-- Tailwind CSS untuk UI/UX -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js untuk Render 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls untuk interaksi mouse -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: white; }
        /* Custom Scrollbar untuk panel input */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        #canvas-container { cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen font-sans">

    <!-- PANEL KONTROL KIRI -->
    <div class="w-full md:w-1/3 lg:w-1/4 h-[40vh] md:h-screen bg-slate-900 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col shadow-2xl z-10">
        
        <!-- Header -->
        <div class="p-5 bg-slate-800 border-b border-slate-700">
            <h1 class="text-xl font-bold text-indigo-400">Icosahedron Engine</h1>
            <p class="text-xs text-slate-400 mt-1">Konfigurator Dadu 20-Sisi Kustom</p>
        </div>

        <!-- Kontrol Kecepatan -->
        <div class="p-5 border-b border-slate-700">
            <label class="block text-sm font-semibold text-slate-300 mb-2 flex justify-between">
                <span>Kecepatan Putar (Auto-Spin)</span>
                <span id="speed-display" class="text-indigo-400">1x</span>
            </label>
            <input type="range" id="speed-slider" min="0" max="10" step="0.1" value="1" class="w-full accent-indigo-500 cursor-pointer">
            <p class="text-xs text-slate-500 mt-2">Gunakan mouse pada area 3D untuk memutar manual.</p>
        </div>

        <!-- Input 20 Wajah -->
        <div class="flex-1 overflow-y-auto p-5">
            <h2 class="text-sm font-semibold text-slate-300 mb-4 border-b border-slate-700 pb-2">Variabel 20 Wajah</h2>
            <div id="inputs-container" class="grid grid-cols-2 gap-3">
                <!-- Input akan di-generate via JavaScript -->
            </div>
            
            <button id="btn-reset" class="mt-6 w-full py-2 bg-slate-700 hover:bg-slate-600 text-white rounded transition-colors text-sm font-semibold">
                Reset Kosong
            </button>
            <button id="btn-number" class="mt-3 w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded transition-colors text-sm font-semibold shadow-lg shadow-indigo-900/50">
                Isi Urutan 1 - 20
            </button>
        </div>
    </div>

    <!-- PANEL RENDER 3D KANAN -->
    <div id="canvas-container" class="w-full md:w-2/3 lg:w-3/4 h-[60vh] md:h-screen relative bg-slate-950">
        <!-- Render ThreeJS disini -->
    </div>

    <script>
        // --- KONFIGURASI AWAL ---
        const CANVAS_CONTAINER = document.getElementById('canvas-container');
        const INPUTS_CONTAINER = document.getElementById('inputs-container');
        const SPEED_SLIDER = document.getElementById('speed-slider');
        const SPEED_DISPLAY = document.getElementById('speed-display');

        // Parameter Warna
        const COLOR_BG = 0x020617; // Slate 950
        const COLOR_FACE = '#4338ca'; // Indigo 700
        const COLOR_TEXT = '#ffffff';

        // Variabel Global Three.js
        let scene, camera, renderer, controls, icosahedron;
        let materials = [];
        let textures = [];
        
        // Parameter Rotasi
        let speedMultiplier = 1;
        let baseRotationSpeed = { x: 0.005, y: 0.008, z: 0.003 };

        // --- INISIALISASI THREE.JS ---
        function init3D() {
            // 1. Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(COLOR_BG);
            
            const aspect = CANVAS_CONTAINER.clientWidth / CANVAS_CONTAINER.clientHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.z = 15;

            // 2. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(CANVAS_CONTAINER.clientWidth, CANVAS_CONTAINER.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            CANVAS_CONTAINER.appendChild(renderer.domElement);

            // 3. Pencahayaan
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(10, 10, 10);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x818cf8, 0.5); // Cahaya aksen indigo
            dirLight2.position.set(-10, -10, -10);
            scene.add(dirLight2);

            // 4. Geometri (Icosahedron)
            const radius = 5;
            // Kita simpan geometri dasar (indexed) untuk membuat garis rusuk yang sempurna
            const baseGeometry = new THREE.IcosahedronGeometry(radius, 0);
            
            // Membuat objek garis rusuk murni 3D (Edges)
            const edgesGeometry = new THREE.EdgesGeometry(baseGeometry);
            const edgesMaterial = new THREE.LineBasicMaterial({ color: 0x0f172a }); // Warna garis pinggir (Slate 900 / hitam gelap)
            const icosahedronEdges = new THREE.LineSegments(edgesGeometry, edgesMaterial);

            // Menggunakan toNonIndexed agar setiap wajah (segitiga) punya material terpisah secara presisi
            let geometry = baseGeometry.clone().toNonIndexed();
            
            // Rekayasa Ulang UV Mapping
            // UV bawaan bulat, kita paksa UV mapping untuk pas dengan bentuk segitiga pada kanvas
            const uvAttribute = geometry.attributes.uv;
            for (let i = 0; i < 20; i++) {
                // Mapping 3 vertex setiap wajah ke koordinat segitiga di kanvas 2D
                uvAttribute.setXY(i * 3 + 0, 0, 0);       // Kiri Bawah
                uvAttribute.setXY(i * 3 + 1, 1, 0);       // Kanan Bawah
                uvAttribute.setXY(i * 3 + 2, 0.5, 1);     // Tengah Atas
                
                // Set Grup Material (1 wajah = 1 material)
                geometry.addGroup(i * 3, 3, i);
            }
            uvAttribute.needsUpdate = true;

            // 5. Material Dinamis
            for (let i = 0; i < 20; i++) {
                const mat = createDynamicMaterial(""); // Mulai dengan kosong
                materials.push(mat);
            }

            // 6. Membuat Mesh
            icosahedron = new THREE.Mesh(geometry, materials);
            icosahedron.add(icosahedronEdges); // Gabungkan garis rusuk 3D ke objek utama agar ikut berputar
            scene.add(icosahedron);

            // 7. Kontrol Mouse
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.autoRotate = false; // Kita handle rotasi manual di animate()

            // Handle Resize
            window.addEventListener('resize', onWindowResize, false);
        }

        // --- PEMBUATAN MATERIAL KANVAS (QA: Presisi Rendering Teks) ---
        function createDynamicMaterial(text) {
            const canvasSize = 512;
            const canvas = document.createElement('canvas');
            canvas.width = canvasSize;
            canvas.height = canvasSize;
            const ctx = canvas.getContext('2d');

            drawCanvas(ctx, canvasSize, text);

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            textures.push({ canvas, ctx, texture });

            return new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.3,
                metalness: 0.2,
            });
        }

        function drawCanvas(ctx, size, text) {
            // Background Base
            ctx.fillStyle = COLOR_FACE;
            ctx.fillRect(0, 0, size, size);

            // Teks Rendering
            if(text !== "") {
                ctx.fillStyle = COLOR_TEXT;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Dinamis Ukuran Font berdasarkan panjang karakter
                let fontSize = 140; // Ukuran disesuaikan agar tidak menabrak batas segitiga
                if (text.length > 2) fontSize = 100;
                if (text.length > 4) fontSize = 70;
                if (text.length > 6) fontSize = 45;

                ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                
                // Kalkulasi QA: Titik berat (Centroid) dari mapping UV Segitiga
                // UV memetakan alas segitiga ke bagian bawah kanvas (Y = size)
                // Titik tengah matematisnya adalah (size + size + 0) / 3 = 2/3 * size
                const yPos = size * (2 / 3);
                
                ctx.fillText(text, size / 2, yPos);
            }
        }

        // --- UPDATE TEKS BERDASARKAN INPUT ---
        function updateFaceText(index, text) {
            const canvasData = textures[index];
            if(!canvasData) return;
            
            // Bersihkan dan gambar ulang
            canvasData.ctx.clearRect(0, 0, canvasData.canvas.width, canvasData.canvas.height);
            drawCanvas(canvasData.ctx, canvasData.canvas.width, text);
            
            // Beritahu Three.js bahwa tekstur diperbarui
            canvasData.texture.needsUpdate = true;
        }

        // --- PEMBANGUNAN UI INPUT ---
        function initUI() {
            for (let i = 0; i < 20; i++) {
                const wrapper = document.createElement('div');
                
                const label = document.createElement('label');
                label.className = "block text-xs font-medium text-slate-400 mb-1";
                label.innerText = `Sisi ${i + 1}`;
                
                const input = document.createElement('input');
                input.type = "text";
                input.id = `input-face-${i}`;
                input.className = "w-full bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all";
                input.placeholder = "Kosong";
                
                // Event listener saat user mengetik
                input.addEventListener('input', (e) => {
                    updateFaceText(i, e.target.value);
                });

                wrapper.appendChild(label);
                wrapper.appendChild(input);
                INPUTS_CONTAINER.appendChild(wrapper);
            }

            // Kontrol Kecepatan
            SPEED_SLIDER.addEventListener('input', (e) => {
                speedMultiplier = parseFloat(e.target.value);
                SPEED_DISPLAY.innerText = speedMultiplier.toFixed(1) + "x";
            });

            // Tombol Preset
            document.getElementById('btn-reset').addEventListener('click', () => {
                for (let i = 0; i < 20; i++) {
                    document.getElementById(`input-face-${i}`).value = "";
                    updateFaceText(i, "");
                }
            });

            document.getElementById('btn-number').addEventListener('click', () => {
                for (let i = 0; i < 20; i++) {
                    const val = (i + 1).toString();
                    document.getElementById(`input-face-${i}`).value = val;
                    updateFaceText(i, val);
                }
            });
        }

        // --- ANIMASI DAN RESIZE ---
        function onWindowResize() {
            const width = CANVAS_CONTAINER.clientWidth;
            const height = CANVAS_CONTAINER.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Logika Perputaran 360 Derajat
            if (icosahedron) {
                icosahedron.rotation.x += baseRotationSpeed.x * speedMultiplier;
                icosahedron.rotation.y += baseRotationSpeed.y * speedMultiplier;
                icosahedron.rotation.z += baseRotationSpeed.z * speedMultiplier;
            }

            controls.update(); // Dibutuhkan jika menggunakan damping (smooth drag)
            renderer.render(scene, camera);
        }

        // --- EKSEKUSI UTAMA ---
        init3D();
        initUI();
        animate();

    </script>
</body>
</html>
