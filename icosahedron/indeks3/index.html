<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Custom Math Icosahedron</title>
    
    <!-- Tailwind CSS untuk UI/UX -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js untuk Render 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls untuk interaksi mouse -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Konfigurasi MathJax (Library untuk render LaTeX ke SVG) -->
    <script>
        window.MathJax = {
            options: { enableMenu: false },
            svg: { fontCache: 'local' },
            startup: {
                typeset: false,
                pageReady: () => {
                    return MathJax.startup.defaultPageReady().then(() => {
                        window.mathJaxReady = true;
                        // Render ulang seluruh sisi jika MathJax sudah termuat
                        if(typeof allTextures !== 'undefined' && allTextures.length > 0) {
                            for(let d=0; d<3; d++) {
                                for(let i=0; i<20; i++) {
                                    updateFace(d, i);
                                }
                            }
                        }
                    });
                }
            }
        };
    </script>
    <!-- Script MathJax Utama -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: white; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        #canvas-container { cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen font-sans">

    <!-- PANEL KONTROL KIRI -->
    <div id="left-panel" class="w-full md:w-1/3 lg:w-1/4 h-[40vh] md:h-screen bg-slate-900 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col shadow-2xl z-10 transition-all duration-300">
        
        <!-- Header -->
        <div class="p-5 bg-slate-800 border-b border-slate-700">
            <h1 class="text-xl font-bold text-indigo-400">Math Icosahedron</h1>
            <p class="text-xs text-slate-400 mt-1">Dadu 20-Sisi dengan Indeks & LaTeX</p>
        </div>

        <!-- Kontrol Kecepatan -->
        <div class="p-4 border-b border-slate-700 bg-slate-800/50">
            <label class="block text-sm font-semibold text-slate-300 mb-2 flex justify-between">
                <span>Kecepatan Putar</span>
                <span id="speed-display" class="text-indigo-400">1x</span>
            </label>
            <input type="range" id="speed-slider" min="0" max="10" step="0.1" value="1" class="w-full accent-indigo-500 cursor-pointer mb-4">
            
            <!-- Kontrol Jumlah Dadu (BARU) -->
            <label class="block text-sm font-semibold text-slate-300 mb-2">Jumlah Icosahedron</label>
            <div class="flex gap-2">
                <button id="btn-dice-1" class="flex-1 py-1.5 bg-indigo-600 text-white rounded text-sm font-bold shadow transition-colors">1</button>
                <button id="btn-dice-2" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-sm font-bold shadow transition-colors">2</button>
                <button id="btn-dice-3" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-sm font-bold shadow transition-colors">3</button>
            </div>
        </div>

        <!-- Input 20 Wajah -->
        <div class="flex-1 overflow-y-auto p-5">
            <!-- Pilihan Dadu yang Diedit (BARU) -->
            <div class="border-b border-slate-700 mb-4 pb-3">
                <h2 class="text-sm font-semibold text-slate-300 mb-2">Pilih Dadu untuk Diedit:</h2>
                <div class="flex gap-2">
                    <button id="btn-edit-die-0" class="flex-1 py-1.5 bg-emerald-600 text-white rounded text-xs font-bold shadow transition-colors">Dadu 1</button>
                    <button id="btn-edit-die-1" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-xs font-bold shadow transition-colors">Dadu 2</button>
                    <button id="btn-edit-die-2" class="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-xs font-bold shadow transition-colors">Dadu 3</button>
                </div>
            </div>

            <div class="border-b border-slate-700 mb-4 pb-3 flex justify-between items-start">
                <div>
                    <h2 class="text-sm font-semibold text-slate-300 mb-1">Variabel 20 Sisi</h2>
                    <p class="text-[11px] text-slate-400 leading-tight">
                        <b>Warna</b> | <b>Indeks</b> | <b>Nilai</b> (LaTeX)
                    </p>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <!-- Toggle Switch untuk Tampilkan/Sembunyikan Indeks -->
                    <div class="flex items-center gap-2">
                        <label class="text-[10px] text-slate-400 cursor-pointer" for="toggle-index">Tampilkan Indeks</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-index" class="sr-only peer" checked>
                            <div class="w-7 h-4 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-500"></div>
                        </label>
                    </div>
                    <!-- Pemilih Warna Indeks -->
                    <div class="flex items-center gap-2">
                        <label class="text-[10px] text-slate-400">Warna Indeks</label>
                        <input type="color" id="global-index-color" value="#cbd5e1" class="w-5 h-5 shrink-0 cursor-pointer bg-slate-900 border border-slate-600 rounded p-0" title="Ubah warna semua teks indeks">
                    </div>
                </div>
            </div>
            
            <div id="inputs-container" class="grid grid-cols-1 gap-3">
                <!-- Input akan di-generate via JavaScript -->
            </div>
            
            <div class="grid grid-cols-2 gap-2 mt-6 mb-2">
                <button id="btn-number" class="py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded transition-colors text-xs font-semibold shadow-lg shadow-indigo-900/50">
                    Isi 1 - 20
                </button>
                <button id="btn-letter" class="py-2 bg-blue-600 hover:bg-blue-500 text-white rounded transition-colors text-xs font-semibold shadow-lg shadow-blue-900/50">
                    Isi A - T
                </button>
                <button id="btn-math" class="py-2 bg-purple-600 hover:bg-purple-500 text-white rounded transition-colors text-xs font-semibold shadow-lg shadow-purple-900/50">
                    Contoh Math
                </button>
                <button id="btn-random-color" class="py-2 bg-pink-600 hover:bg-pink-500 text-white rounded transition-colors text-xs font-semibold shadow-lg shadow-pink-900/50">
                    Acak Warna
                </button>
            </div>
            <button id="btn-reset" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-white rounded transition-colors text-sm font-semibold">
                Reset Nilai
            </button>

            <!-- Fitur Penyimpanan Multi-Slot -->
            <div class="mt-6 border-t border-slate-700 pt-4 pb-4">
                <h3 class="text-sm font-semibold text-slate-300 mb-2">Simpan Konfigurasi</h3>
                <div class="flex gap-2">
                    <input type="text" id="input-save-name" placeholder="Beri nama (misal: Aljabar 1)" class="flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 transition-all min-w-0">
                    <button id="btn-save" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded transition-colors text-xs font-semibold shadow-lg shadow-emerald-900/50 shrink-0">
                        💾 Simpan
                    </button>
                </div>
                <p id="save-status" class="text-[11px] text-center mt-2 opacity-0 transition-opacity duration-300 font-medium"></p>
                
                <!-- Daftar Simpanan -->
                <div class="mt-3">
                    <h4 class="text-[11px] font-medium text-slate-400 mb-2 uppercase tracking-wider">Daftar Tersimpan:</h4>
                    <ul id="saved-list" class="space-y-1.5 max-h-32 overflow-y-auto pr-1">
                        <!-- List item di-generate via JS -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL RENDER 3D KANAN -->
    <div id="canvas-container" class="flex-1 w-full h-[60vh] md:h-screen relative bg-slate-950">
        <!-- Tombol Toggle Panel Kiri -->
        <button id="btn-toggle-panel" class="absolute top-4 left-4 z-30 p-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white rounded shadow-lg transition-colors group" title="Sembunyikan/Tampilkan Panel">
            <!-- Icon Hamburger -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-300 group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <!-- Render ThreeJS disini -->
    </div>

    <script>
        // --- KONFIGURASI AWAL ---
        const CANVAS_CONTAINER = document.getElementById('canvas-container');
        const INPUTS_CONTAINER = document.getElementById('inputs-container');
        const SPEED_SLIDER = document.getElementById('speed-slider');
        const SPEED_DISPLAY = document.getElementById('speed-display');
        const LEFT_PANEL = document.getElementById('left-panel');
        const BTN_TOGGLE_PANEL = document.getElementById('btn-toggle-panel');

        // Parameter Warna
        const COLOR_BG = 0x020617; // Slate 950
        const DEFAULT_FACE_COLOR = '#4338ca'; // Indigo 700
        const COLOR_TEXT = '#ffffff';

        let globalIndexColor = '#cbd5e1'; // Warna global untuk teks indeks
        let showIndex = true; // Status tampil/sembunyi indeks

        // Variabel Global Data dan Three.js
        let scene, camera, renderer, controls;
        let icosahedrons = []; // Menampung array dari mesh icosahedron
        
        let allMaterials = [[], [], []];
        let allTextures = [[], [], []];
        let sharedGeometry, sharedEdgesGeometry, sharedEdgesMaterial;
        
        let diceCount = 1; // Menyimpan status jumlah dadu saat ini
        let activeEditDie = 0; // Index dadu mana yang sedang diedit di UI (0, 1, atau 2)
        
        let speedMultiplier = 1;
        let baseRotationSpeed = { x: 0.005, y: 0.008, z: 0.003 };

        // Data State untuk 3 Dadu, masing-masing 20 sisi
        let allFaceData = Array.from({length: 3}, () => 
            Array.from({length: 20}, (_, i) => ({ 
                label: String.fromCharCode(65 + i), // Default Indeks A sampai T
                value: '',
                color: DEFAULT_FACE_COLOR // Warna default tiap sisi
            }))
        );

        // --- INISIALISASI THREE.JS ---
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(COLOR_BG);
            
            const aspect = CANVAS_CONTAINER.clientWidth / CANVAS_CONTAINER.clientHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(CANVAS_CONTAINER.clientWidth, CANVAS_CONTAINER.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            CANVAS_CONTAINER.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(10, 10, 10);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x818cf8, 0.5);
            dirLight2.position.set(-10, -10, -10);
            scene.add(dirLight2);

            // Persiapan Geometri Bersama
            const radius = 5;
            const baseGeometry = new THREE.IcosahedronGeometry(radius, 0);
            
            sharedEdgesGeometry = new THREE.EdgesGeometry(baseGeometry);
            sharedEdgesMaterial = new THREE.LineBasicMaterial({ color: 0x0f172a });

            sharedGeometry = baseGeometry.clone().toNonIndexed();
            
            const uvAttribute = sharedGeometry.attributes.uv;
            for (let i = 0; i < 20; i++) {
                uvAttribute.setXY(i * 3 + 0, 0, 0);       // Kiri Bawah
                uvAttribute.setXY(i * 3 + 1, 1, 0);       // Kanan Bawah
                uvAttribute.setXY(i * 3 + 2, 0.5, 1);     // Tengah Atas
                sharedGeometry.addGroup(i * 3, 3, i);
            }
            uvAttribute.needsUpdate = true;

            // Buat Material terpisah untuk ke-3 dadu
            for (let d = 0; d < 3; d++) {
                for (let i = 0; i < 20; i++) {
                    const matData = createBlankMaterial();
                    allTextures[d].push({ canvas: matData.canvas, ctx: matData.ctx, texture: matData.texture });
                    allMaterials[d].push(matData.material);
                }
            }

            // Panggil fungsi untuk merender jumlah dadu sesuai state awal
            updateDiceDisplay();

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.autoRotate = false;

            window.addEventListener('resize', onWindowResize, false);
            
            // Render awal sisi-sisinya untuk semua dadu
            for (let d = 0; d < 3; d++) {
                for (let i = 0; i < 20; i++) {
                    updateFace(d, i);
                }
            }
        }

        function updateDiceDisplay() {
            // Hapus semua dadu yang ada sebelumnya dari scene
            icosahedrons.forEach(die => {
                scene.remove(die);
            });
            icosahedrons = [];

            const positions = [];
            
            // Penentuan layout dan posisi kamera berdasarkan jumlah dadu
            if (diceCount === 1) {
                positions.push({ x: 0, y: 0, z: 0 });
                camera.position.z = 15;
            } else if (diceCount === 2) {
                positions.push({ x: -6, y: 0, z: 0 });
                positions.push({ x: 6, y: 0, z: 0 });
                camera.position.z = 20;
            } else if (diceCount === 3) {
                positions.push({ x: -12, y: 0, z: 0 });
                positions.push({ x: 0, y: 0, z: 0 });
                positions.push({ x: 12, y: 0, z: 0 });
                camera.position.z = 28;
            }

            // Buat dadu sesuai posisi yang ditentukan
            positions.forEach((pos, index) => {
                // Pasangkan material yang sesuai dengan index dadu
                const mesh = new THREE.Mesh(sharedGeometry, allMaterials[index]);
                const edges = new THREE.LineSegments(sharedEdgesGeometry, sharedEdgesMaterial);
                mesh.add(edges);
                
                mesh.position.set(pos.x, pos.y, pos.z);
                
                // Rotasi awal yang acak agar tidak terlihat seragam
                mesh.rotation.x = Math.random() * Math.PI * 2;
                mesh.rotation.y = Math.random() * Math.PI * 2;
                mesh.rotation.z = Math.random() * Math.PI * 2;

                scene.add(mesh);
                icosahedrons.push(mesh);
            });
            
            // Update kamera bila diceCount berubah
            camera.updateProjectionMatrix();
        }

        function createBlankMaterial() {
            const canvasSize = 512;
            const canvas = document.createElement('canvas');
            canvas.width = canvasSize;
            canvas.height = canvasSize;
            const ctx = canvas.getContext('2d');

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            
            const material = new THREE.MeshBasicMaterial({
                map: texture,
            });

            return { canvas, ctx, texture, material };
        }

        // --- UPDATE TEKS DAN INDEKS (LOGIC UTAMA) ---
        function updateFace(dieIndex, faceIndex) {
            const data = allFaceData[dieIndex][faceIndex];
            const canvasData = allTextures[dieIndex][faceIndex];
            if(!canvasData) return;
            
            const size = canvasData.canvas.width;
            const ctx = canvasData.ctx;
            const text = data.value;
            const labelText = data.label;
            const bgColor = data.color;
            const indexColor = globalIndexColor; 

            const renderFinal = (imgElement, isFallback) => {
                // 1. Bersihkan background
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, size, size);

                // 2. Gambar Indeks/Label di 3 titik sudut segitiga
                if (showIndex && labelText) {
                    ctx.fillStyle = indexColor;
                    ctx.textBaseline = 'middle';
                    let labelSize = size * 0.10; 
                    if(labelText.length > 2) labelSize = size * 0.07;
                    ctx.font = `bold ${labelSize}px Arial, sans-serif`;
                    
                    // Sudut Atas
                    ctx.textAlign = 'center';
                    ctx.fillText(labelText, size / 2, size * 0.15);
                    
                    // Sudut Kiri Bawah
                    ctx.textAlign = 'center';
                    ctx.fillText(labelText, size * 0.18, size * 0.85);
                    
                    // Sudut Kanan Bawah
                    ctx.textAlign = 'center';
                    ctx.fillText(labelText, size * 0.82, size * 0.85);
                }

                // 3. Gambar Nilai/Matematika di bagian tengah
                if (text && text.trim() !== "") {
                    const mathY = size * 0.55; 

                    if (isFallback || !imgElement) {
                        ctx.fillStyle = COLOR_TEXT;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        
                        let fontSize = 120;
                        if (text.length > 2) fontSize = 80;
                        if (text.length > 4) fontSize = 55;
                        if (text.length > 6) fontSize = 35;

                        ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                        ctx.fillText(text, size / 2, mathY);
                    } else {
                        const pxWidth = imgElement.customWidth;
                        const pxHeight = imgElement.customHeight;
                        ctx.drawImage(imgElement, (size - pxWidth) / 2, mathY - pxHeight / 2, pxWidth, pxHeight);
                    }
                }
                
                canvasData.texture.needsUpdate = true;
            };

            if (!text || text.trim() === "") {
                renderFinal(null, true);
                return;
            }

            if (window.mathJaxReady) {
                window.MathJax.tex2svgPromise(text, {display: true}).then((node) => {
                    const svg = node.querySelector('svg');
                    if (!svg) {
                        renderFinal(null, true);
                        return;
                    }

                    const viewBox = svg.getAttribute('viewBox').split(' ');
                    const vbWidth = parseFloat(viewBox[2]);
                    const vbHeight = parseFloat(viewBox[3]);

                    let pxWidth = vbWidth * 0.12;
                    let pxHeight = vbHeight * 0.12;

                    const maxWidth = size * 0.60;
                    const maxHeight = size * 0.40;
                    
                    const scale = Math.min(1, maxWidth / pxWidth, maxHeight / pxHeight);
                    pxWidth *= scale;
                    pxHeight *= scale;

                    svg.setAttribute('width', pxWidth + 'px');
                    svg.setAttribute('height', pxHeight + 'px');
                    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

                    let svgString = new XMLSerializer().serializeToString(svg);
                    svgString = svgString.replace(/currentColor/g, COLOR_TEXT); 

                    const img = new Image();
                    img.customWidth = pxWidth;
                    img.customHeight = pxHeight;
                    img.onload = () => { renderFinal(img, false); };
                    img.onerror = () => { renderFinal(null, true); };
                    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
                }).catch(() => {
                    renderFinal(null, true);
                });
            } else {
                renderFinal(null, true);
            }
        }

        // --- PEMBANGUNAN UI INPUT ---
        function initUI() {
            // Logika Toggle Panel Kiri
            BTN_TOGGLE_PANEL.addEventListener('click', () => {
                LEFT_PANEL.classList.toggle('hidden');
                setTimeout(onWindowResize, 10);
            });

            // Kontrol Jumlah Dadu
            const setDiceCount = (count) => {
                diceCount = count;
                [1, 2, 3].forEach(num => {
                    const btn = document.getElementById(`btn-dice-${num}`);
                    if (num === count) {
                        btn.className = "flex-1 py-1.5 bg-indigo-600 text-white rounded text-sm font-bold shadow transition-colors";
                    } else {
                        btn.className = "flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-sm font-bold shadow transition-colors";
                    }
                });
                updateDiceDisplay();
            };

            document.getElementById('btn-dice-1').addEventListener('click', () => setDiceCount(1));
            document.getElementById('btn-dice-2').addEventListener('click', () => setDiceCount(2));
            document.getElementById('btn-dice-3').addEventListener('click', () => setDiceCount(3));

            // Logika Ganti Dadu yang Diedit
            const setActiveEditDie = (index) => {
                activeEditDie = index;
                [0, 1, 2].forEach(num => {
                    const btn = document.getElementById(`btn-edit-die-${num}`);
                    if (num === index) {
                        btn.className = "flex-1 py-1.5 bg-emerald-600 text-white rounded text-xs font-bold shadow transition-colors";
                    } else {
                        btn.className = "flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-xs font-bold shadow transition-colors";
                    }
                });
                // Sinkronisasi nilai UI dengan data dadu yang dipilih
                for (let i = 0; i < 20; i++) {
                    document.getElementById(`input-color-${i}`).value = allFaceData[activeEditDie][i].color;
                    document.getElementById(`input-label-${i}`).value = allFaceData[activeEditDie][i].label;
                    document.getElementById(`input-face-${i}`).value = allFaceData[activeEditDie][i].value;
                }
            };

            document.getElementById('btn-edit-die-0').addEventListener('click', () => setActiveEditDie(0));
            document.getElementById('btn-edit-die-1').addEventListener('click', () => setActiveEditDie(1));
            document.getElementById('btn-edit-die-2').addEventListener('click', () => setActiveEditDie(2));

            // Event listener Toggle & Color Indeks
            document.getElementById('toggle-index').addEventListener('change', (e) => {
                showIndex = e.target.checked;
                for (let d = 0; d < 3; d++) {
                    for (let i = 0; i < 20; i++) { updateFace(d, i); }
                }
            });

            document.getElementById('global-index-color').addEventListener('input', (e) => {
                globalIndexColor = e.target.value;
                for (let d = 0; d < 3; d++) {
                    for (let i = 0; i < 20; i++) { updateFace(d, i); }
                }
            });

            for (let i = 0; i < 20; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = "flex gap-2 items-center bg-slate-800/50 p-2 rounded border border-slate-700";
                
                const inputColor = document.createElement('input');
                inputColor.type = "color";
                inputColor.id = `input-color-${i}`;
                inputColor.className = "w-8 h-8 shrink-0 cursor-pointer bg-slate-900 border border-slate-600 rounded p-0";
                inputColor.value = allFaceData[activeEditDie][i].color;
                inputColor.title = "Warna Sisi";

                const inputLabel = document.createElement('input');
                inputLabel.type = "text";
                inputLabel.id = `input-label-${i}`;
                inputLabel.className = "w-10 md:w-12 shrink-0 bg-slate-900 border border-slate-600 rounded px-1 py-1.5 text-sm font-bold text-center text-slate-300 focus:outline-none focus:border-indigo-500 transition-all";
                inputLabel.value = allFaceData[activeEditDie][i].label;
                inputLabel.title = "Indeks Sisi (Misal: A)";
                
                const inputValue = document.createElement('input');
                inputValue.type = "text";
                inputValue.id = `input-face-${i}`;
                inputValue.className = "flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all min-w-0";
                inputValue.placeholder = "Nilai atau Rumus Latex";
                
                inputColor.addEventListener('input', (e) => {
                    allFaceData[activeEditDie][i].color = e.target.value;
                    updateFace(activeEditDie, i);
                });
                inputLabel.addEventListener('input', (e) => {
                    allFaceData[activeEditDie][i].label = e.target.value;
                    updateFace(activeEditDie, i);
                });
                inputValue.addEventListener('input', (e) => {
                    allFaceData[activeEditDie][i].value = e.target.value;
                    updateFace(activeEditDie, i);
                });

                wrapper.appendChild(inputColor);
                wrapper.appendChild(inputLabel);
                wrapper.appendChild(inputValue);
                INPUTS_CONTAINER.appendChild(wrapper);
            }

            SPEED_SLIDER.addEventListener('input', (e) => {
                speedMultiplier = parseFloat(e.target.value);
                SPEED_DISPLAY.innerText = speedMultiplier.toFixed(1) + "x";
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                for (let i = 0; i < 20; i++) {
                    allFaceData[activeEditDie][i].value = "";
                    document.getElementById(`input-face-${i}`).value = "";
                    updateFace(activeEditDie, i);
                }
            });

            document.getElementById('btn-number').addEventListener('click', () => {
                for (let i = 0; i < 20; i++) {
                    allFaceData[activeEditDie][i].value = (i + 1).toString();
                    document.getElementById(`input-face-${i}`).value = allFaceData[activeEditDie][i].value;
                    updateFace(activeEditDie, i);
                }
            });

            document.getElementById('btn-letter').addEventListener('click', () => {
                for (let i = 0; i < 20; i++) {
                    allFaceData[activeEditDie][i].value = String.fromCharCode(65 + i);
                    document.getElementById(`input-face-${i}`).value = allFaceData[activeEditDie][i].value;
                    updateFace(activeEditDie, i);
                }
            });

            document.getElementById('btn-random-color').addEventListener('click', () => {
                const distinctColors = [
                    "#ef4444", "#f97316", "#f59e0b", "#eab308", "#84cc16",
                    "#22c55e", "#10b981", "#14b8a6", "#06b6d4", "#0ea5e9",
                    "#3b82f6", "#6366f1", "#8b5cf6", "#a855f7", "#d946ef",
                    "#ec4899", "#f43f5e", "#9f1239", "#431407", "#0f766e"
                ];
                
                for (let i = distinctColors.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [distinctColors[i], distinctColors[j]] = [distinctColors[j], distinctColors[i]];
                }

                for (let i = 0; i < 20; i++) {
                    allFaceData[activeEditDie][i].color = distinctColors[i];
                    document.getElementById(`input-color-${i}`).value = distinctColors[i];
                    updateFace(activeEditDie, i);
                }
            });

            document.getElementById('btn-math').addEventListener('click', () => {
                const mathExamples = [
                    "200", "\\sqrt{64}", "\\frac{1}{2}", "x^2", "y = mx+c",
                    "\\pi", "\\alpha", "\\beta", "A = \\pi r^2", "E=mc^2", 
                    "\\sum_{n=1}^{10}", "\\infty", "a^2+b^2=c^2", "50\\%", "\\int x dx",
                    "1 \\frac{1}{2}", "\\frac{x}{y}", "x \\pm 1", "\\Delta", "10^3"
                ];
                for (let i = 0; i < 20; i++) {
                    allFaceData[activeEditDie][i].value = mathExamples[i];
                    document.getElementById(`input-face-${i}`).value = allFaceData[activeEditDie][i].value;
                    updateFace(activeEditDie, i);
                }
            });

            // --- LOGIKA PENYIMPANAN MULTI-SLOT (LOCAL STORAGE) ---
            const SAVE_KEY = 'mathIcosahedronSaves_v3';
            const statusText = document.getElementById('save-status');
            const inputSaveName = document.getElementById('input-save-name');
            const savedList = document.getElementById('saved-list');

            function showStatus(msg, colorClass) {
                statusText.innerText = msg;
                statusText.className = `text-[11px] text-center mt-2 ${colorClass} opacity-100 transition-opacity duration-300 font-medium`;
                setTimeout(() => {
                    statusText.classList.remove('opacity-100');
                    statusText.classList.add('opacity-0');
                }, 3000);
            }

            function getSaves() {
                const saves = localStorage.getItem(SAVE_KEY);
                return saves ? JSON.parse(saves) : {};
            }

            function renderSaveList() {
                const saves = getSaves();
                savedList.innerHTML = '';
                const names = Object.keys(saves);
                
                if (names.length === 0) {
                    savedList.innerHTML = '<li class="text-[11px] text-slate-500 text-center italic py-2">Belum ada data tersimpan</li>';
                    return;
                }

                names.forEach(name => {
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center bg-slate-800 p-1.5 rounded border border-slate-700 hover:border-slate-500 transition-colors group";
                    
                    const nameBtn = document.createElement('button');
                    nameBtn.className = "flex-1 text-left text-xs text-slate-300 group-hover:text-white font-medium truncate mr-2 px-1";
                    nameBtn.innerText = name;
                    nameBtn.title = `Muat data: ${name}`;
                    nameBtn.onclick = () => loadData(name);

                    const delBtn = document.createElement('button');
                    delBtn.className = "text-slate-500 hover:text-red-400 p-1 rounded transition-colors text-xs bg-slate-900/50 hover:bg-slate-900";
                    delBtn.innerHTML = "🗑️";
                    delBtn.title = "Hapus simpanan ini";
                    delBtn.onclick = () => deleteData(name);

                    li.appendChild(nameBtn);
                    li.appendChild(delBtn);
                    savedList.appendChild(li);
                });
            }

            function saveCurrentData() {
                const name = inputSaveName.value.trim();
                if (!name) {
                    showStatus("⚠️ Tolong masukkan nama simpanan!", "text-amber-400");
                    return;
                }

                const saves = getSaves();
                saves[name] = {
                    allFaces: allFaceData,
                    indexColor: globalIndexColor,
                    showIndex: showIndex,
                    diceCount: diceCount
                };
                localStorage.setItem(SAVE_KEY, JSON.stringify(saves));
                
                inputSaveName.value = '';
                renderSaveList();
                showStatus(`✅ "${name}" berhasil disimpan!`, "text-emerald-400");
            }

            function loadData(name) {
                const saves = getSaves();
                if (saves[name]) {
                    const savedItem = saves[name];
                    
                    globalIndexColor = savedItem.indexColor || '#cbd5e1';
                    document.getElementById('global-index-color').value = globalIndexColor;
                    
                    showIndex = savedItem.showIndex !== false; 
                    document.getElementById('toggle-index').checked = showIndex;

                    if (savedItem.diceCount) {
                        setDiceCount(savedItem.diceCount);
                    }

                    // Backward compatibility (mendukung file simpanan versi lama)
                    if (savedItem.allFaces) {
                        allFaceData = JSON.parse(JSON.stringify(savedItem.allFaces));
                    } else if (savedItem.faces || Array.isArray(savedItem)) {
                        let parsedFaces = Array.isArray(savedItem) ? savedItem : savedItem.faces;
                        for(let d=0; d<3; d++) {
                            allFaceData[d] = JSON.parse(JSON.stringify(parsedFaces));
                        }
                    }

                    setActiveEditDie(0); // Kembali ke tab edit Dadu 1
                    for (let d = 0; d < 3; d++) {
                        for (let i = 0; i < 20; i++) {
                            updateFace(d, i);
                        }
                    }
                    showStatus(`📂 "${name}" dimuat.`, "text-indigo-400");
                }
            }

            function deleteData(name) {
                if (confirm(`Apakah Anda yakin ingin menghapus "${name}"?`)) {
                    const saves = getSaves();
                    delete saves[name];
                    localStorage.setItem(SAVE_KEY, JSON.stringify(saves));
                    renderSaveList();
                    showStatus(`🗑️ "${name}" dihapus.`, "text-red-400");
                }
            }

            document.getElementById('btn-save').addEventListener('click', saveCurrentData);
            renderSaveList();
        }

        // --- ANIMASI DAN RESIZE ---
        function onWindowResize() {
            const width = CANVAS_CONTAINER.clientWidth;
            const height = CANVAS_CONTAINER.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Menganimasi rotasi pada SEMUA dadu yang ada di array
            icosahedrons.forEach((die) => {
                die.rotation.x += baseRotationSpeed.x * speedMultiplier;
                die.rotation.y += baseRotationSpeed.y * speedMultiplier;
                die.rotation.z += baseRotationSpeed.z * speedMultiplier;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // --- EKSEKUSI UTAMA ---
        init3D();
        initUI();
        animate();

    </script>
</body>
</html>
