<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Custom Math Icosahedron</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        window.MathJax = {
            options: { enableMenu: false },
            svg: { fontCache: 'local' },
            startup: {
                typeset: false,
                pageReady: () => {
                    return MathJax.startup.defaultPageReady().then(() => {
                        window.mathJaxReady = true;
                        // Render ulang seluruh sisi untuk semua dadu jika MathJax sudah termuat
                        if(typeof updateAllFaces === 'function') {
                            updateAllFaces();
                        }
                    });
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: white; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        #canvas-container { cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        
        .tab-btn.active {
            background-color: #4f46e5; /* indigo-600 */
            color: white;
            border-bottom-color: transparent;
        }
        .tab-btn {
            background-color: #1e293b; /* slate-800 */
            color: #94a3b8; /* slate-400 */
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen font-sans">

    <!-- PANEL KONTROL KIRI -->
    <div id="left-panel" class="w-full md:w-1/3 lg:w-1/4 h-[40vh] md:h-screen bg-slate-900 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col shadow-2xl z-10 transition-all duration-300">
        
        <!-- Header -->
        <div class="p-4 bg-slate-800 border-b border-slate-700">
            <h1 class="text-xl font-bold text-indigo-400">Math Icosahedron</h1>
            <p class="text-xs text-slate-400 mt-1">Dadu 20-Sisi Multi-Konfigurasi</p>
        </div>

        <!-- Kontrol Global (Jumlah Dadu & Kecepatan) -->
        <div class="p-4 border-b border-slate-700 bg-slate-800/50 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">Jumlah Icosahedron yang Ditampilkan</label>
                <div class="flex gap-2">
                    <button class="dice-count-btn flex-1 py-1.5 rounded text-sm font-bold border border-indigo-600 bg-indigo-600 text-white transition-all" data-count="1">1 Dadu</button>
                    <button class="dice-count-btn flex-1 py-1.5 rounded text-sm font-bold border border-slate-600 bg-slate-800 text-slate-400 hover:bg-slate-700 transition-all" data-count="2">2 Dadu</button>
                    <button class="dice-count-btn flex-1 py-1.5 rounded text-sm font-bold border border-slate-600 bg-slate-800 text-slate-400 hover:bg-slate-700 transition-all" data-count="3">3 Dadu</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2 flex justify-between">
                    <span>Kecepatan Putar</span>
                    <span id="speed-display" class="text-indigo-400">1x</span>
                </label>
                <input type="range" id="speed-slider" min="0" max="10" step="0.1" value="1" class="w-full accent-indigo-500 cursor-pointer">
            </div>
        </div>

        <!-- Tab Dadu -->
        <div class="flex px-4 pt-3 bg-slate-900 border-b border-slate-700" id="dice-tabs-container">
            <button class="tab-btn active px-4 py-2 text-sm font-bold rounded-t-lg transition-colors" data-dice="0">Dadu 1</button>
            <button class="tab-btn px-4 py-2 text-sm font-bold rounded-t-lg transition-colors hidden" data-dice="1" id="tab-dadu-2">Dadu 2</button>
            <button class="tab-btn px-4 py-2 text-sm font-bold rounded-t-lg transition-colors hidden" data-dice="2" id="tab-dadu-3">Dadu 3</button>
        </div>

        <!-- Input 20 Wajah -->
        <div class="flex-1 overflow-y-auto p-4">
            <div class="border-b border-slate-700 mb-4 pb-3 flex justify-between items-start">
                <div>
                    <h2 class="text-sm font-semibold text-slate-300 mb-1">Variabel <span id="active-dice-label" class="text-indigo-400">Dadu 1</span></h2>
                    <p class="text-[10px] text-slate-400 leading-tight">Warna | Indeks | Nilai (LaTeX)</p>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <div class="flex items-center gap-2">
                        <label class="text-[10px] text-slate-400 cursor-pointer" for="toggle-index">Tampilkan Indeks</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-index" class="sr-only peer" checked>
                            <div class="w-7 h-4 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-500"></div>
                        </label>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-[10px] text-slate-400">Warna Indeks</label>
                        <input type="color" id="global-index-color" value="#cbd5e1" class="w-5 h-5 shrink-0 cursor-pointer bg-slate-900 border border-slate-600 rounded p-0">
                    </div>
                </div>
            </div>
            
            <!-- Tempat Input Wajah Dadu Aktif -->
            <div id="inputs-container" class="grid grid-cols-1 gap-2">
                <!-- Di-generate via JavaScript -->
            </div>
            
            <div class="grid grid-cols-2 gap-2 mt-4 mb-2">
                <button id="btn-number" class="py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-semibold shadow shadow-indigo-900/50">Isi 1 - 20</button>
                <button id="btn-letter" class="py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs font-semibold shadow shadow-blue-900/50">Isi A - T</button>
                <button id="btn-math" class="py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded text-xs font-semibold shadow shadow-purple-900/50">Contoh Math</button>
                <button id="btn-random-color" class="py-1.5 bg-pink-600 hover:bg-pink-500 text-white rounded text-xs font-semibold shadow shadow-pink-900/50">Acak Warna</button>
            </div>
            <button id="btn-reset" class="w-full py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded text-xs font-semibold">Reset Nilai Aktif</button>

            <!-- Fitur Penyimpanan Multi-Slot -->
            <div class="mt-5 border-t border-slate-700 pt-4 pb-4">
                <h3 class="text-sm font-semibold text-slate-300 mb-2">Simpan Konfigurasi</h3>
                <div class="flex gap-2">
                    <input type="text" id="input-save-name" placeholder="Beri nama (misal: Sesi 1)" class="flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500 transition-all">
                    <button id="btn-save" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold shadow shadow-emerald-900/50">💾 Simpan</button>
                </div>
                <p id="save-status" class="text-[10px] text-center mt-1 opacity-0 transition-opacity duration-300"></p>
                <div class="mt-2">
                    <ul id="saved-list" class="space-y-1.5 max-h-32 overflow-y-auto pr-1"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL RENDER 3D KANAN -->
    <div id="canvas-container" class="flex-1 w-full h-[60vh] md:h-screen relative bg-slate-950">
        <button id="btn-toggle-panel" class="absolute top-4 left-4 z-30 p-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white rounded shadow-lg transition-colors group" title="Sembunyikan/Tampilkan Panel">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-300 group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </div>

    <script>
        const CANVAS_CONTAINER = document.getElementById('canvas-container');
        const INPUTS_CONTAINER = document.getElementById('inputs-container');
        
        // Parameter Konfigurasi & Warna
        const COLOR_BG = 0x020617;
        const DEFAULT_FACE_COLORS = ['#4338ca', '#0ea5e9', '#10b981']; // Warna default berbeda untuk tiap dadu
        const COLOR_TEXT = '#ffffff';
        const MAX_DICE = 3;

        let globalIndexColor = '#cbd5e1'; 
        let showIndex = true;
        let activeDiceCount = 1;
        let currentActiveTab = 0; // 0, 1, atau 2

        let scene, camera, renderer, controls;
        let diceMeshes = []; // Array mesh icosahedron
        let diceMaterials = [[], [], []]; // Array material untuk 3 dadu
        let diceTextures = [[], [], []];  // Array texture canvas untuk 3 dadu
        
        // Data State untuk 3 dadu, masing-masing 20 sisi
        let diceData = Array.from({length: MAX_DICE}, (_, diceIdx) => 
            Array.from({length: 20}, (_, faceIdx) => ({ 
                label: String.fromCharCode(65 + faceIdx), 
                value: '',
                color: DEFAULT_FACE_COLORS[diceIdx] 
            }))
        );

        let speedMultiplier = 1;
        // Rotasi awal acak agar dadu tidak sinkron pergerakannya
        let initialRotations = Array.from({length: MAX_DICE}, () => ({
            x: Math.random() * Math.PI, 
            y: Math.random() * Math.PI, 
            z: Math.random() * Math.PI
        }));
        let baseRotationSpeed = { x: 0.005, y: 0.008, z: 0.003 };

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(COLOR_BG);
            
            const aspect = CANVAS_CONTAINER.clientWidth / CANVAS_CONTAINER.clientHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(CANVAS_CONTAINER.clientWidth, CANVAS_CONTAINER.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimasi performa
            CANVAS_CONTAINER.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(10, 10, 10);
            scene.add(dirLight1);

            // Buat Material Dasar (Canvas) untuk ketiga dadu
            const radius = 4;
            const baseGeometry = new THREE.IcosahedronGeometry(radius, 0);
            const edgesGeometry = new THREE.EdgesGeometry(baseGeometry);
            const edgesMaterial = new THREE.LineBasicMaterial({ color: 0x0f172a, linewidth: 2 });
            
            let geometry = baseGeometry.clone().toNonIndexed();
            const uvAttribute = geometry.attributes.uv;
            
            // Pemetaan UV untuk memastikan orientasi canvas ke segitiga 3D
            for (let i = 0; i < 20; i++) {
                uvAttribute.setXY(i * 3 + 0, 0, 0);       // Vert 0 -> Canvas Kiri Bawah
                uvAttribute.setXY(i * 3 + 1, 1, 0);       // Vert 1 -> Canvas Kanan Bawah
                uvAttribute.setXY(i * 3 + 2, 0.5, 1);     // Vert 2 -> Canvas Tengah Atas
                geometry.addGroup(i * 3, 3, i);
            }
            uvAttribute.needsUpdate = true;

            // Inisialisasi Mesh untuk 3 Dadu
            for (let d = 0; d < MAX_DICE; d++) {
                for (let i = 0; i < 20; i++) {
                    const mat = createBlankMaterial(d);
                    diceMaterials[d].push(mat);
                }
                const mesh = new THREE.Mesh(geometry, diceMaterials[d]);
                const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
                mesh.add(edges);
                
                // Set rotasi acak
                mesh.rotation.set(initialRotations[d].x, initialRotations[d].y, initialRotations[d].z);
                diceMeshes.push(mesh);
            }

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;

            window.addEventListener('resize', onWindowResize, false);
            
            updateDiceCountLayout();
            updateAllFaces();
        }

        function createBlankMaterial(diceIndex) {
            const canvasSize = 512;
            const canvas = document.createElement('canvas');
            canvas.width = canvasSize;
            canvas.height = canvasSize;
            const ctx = canvas.getContext('2d');

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            diceTextures[diceIndex].push({ canvas, ctx, texture });

            return new THREE.MeshBasicMaterial({ map: texture });
        }

        // Mengatur posisi dadu berdasarkan jumlah yang aktif
        function updateDiceCountLayout() {
            diceMeshes.forEach(mesh => scene.remove(mesh));

            if (activeDiceCount === 1) {
                diceMeshes[0].position.set(0, 0, 0);
                scene.add(diceMeshes[0]);
                camera.position.z = 15;
            } else if (activeDiceCount === 2) {
                diceMeshes[0].position.set(-4.5, 0, 0);
                diceMeshes[1].position.set(4.5, 0, 0);
                scene.add(diceMeshes[0]);
                scene.add(diceMeshes[1]);
                camera.position.z = 18;
            } else if (activeDiceCount === 3) {
                diceMeshes[0].position.set(-7, 0, 0);
                diceMeshes[1].position.set(0, 0, 0);
                diceMeshes[2].position.set(7, 0, 0);
                scene.add(diceMeshes[0]);
                scene.add(diceMeshes[1]);
                scene.add(diceMeshes[2]);
                camera.position.z = 22;
            }
        }

        function updateAllFaces() {
            for (let d = 0; d < MAX_DICE; d++) {
                for (let i = 0; i < 20; i++) {
                    updateFace(d, i);
                }
            }
        }

        // Logic menggambar (render) ke dalam canvas tekstur sisi
        function updateFace(diceIndex, faceIndex) {
            const data = diceData[diceIndex][faceIndex];
            const canvasData = diceTextures[diceIndex][faceIndex];
            if(!canvasData) return;
            
            const size = canvasData.canvas.width;
            const ctx = canvasData.ctx;
            const text = data.value;
            const labelText = data.label;
            const bgColor = data.color;

            const renderFinal = (imgElement, isFallback) => {
                // 1. Bersihkan background
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, size, size);

                // 2. Gambar Indeks di KETIGA TITIK SUDUT SEGITIGA
                if (showIndex && labelText) {
                    ctx.fillStyle = globalIndexColor;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    let labelSize = size * 0.10; 
                    if(labelText.length > 2) labelSize = size * 0.07;
                    ctx.font = `bold ${labelSize}px Arial, sans-serif`;
                    
                    // Sudut Atas
                    ctx.fillText(labelText, size / 2, size * 0.15);
                    // Sudut Kiri Bawah
                    ctx.fillText(labelText, size * 0.20, size * 0.85);
                    // Sudut Kanan Bawah
                    ctx.fillText(labelText, size * 0.80, size * 0.85);
                }

                // 3. Gambar Nilai/Matematika & Garis Bawah (Underline)
                if (text && text.trim() !== "") {
                    // Y diletakkan sedikit lebih ke atas (0.55) agar pas di tengah area visual segitiga
                    const mathY = size * 0.55; 

                    if (isFallback || !imgElement) {
                        ctx.fillStyle = COLOR_TEXT;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        
                        let fontSize = 120;
                        if (text.length > 2) fontSize = 80;
                        if (text.length > 4) fontSize = 55;
                        if (text.length > 6) fontSize = 35;

                        ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                        ctx.fillText(text, size / 2, mathY);

                        // Gambar Garis Bawah untuk Teks
                        const textWidth = ctx.measureText(text).width;
                        const lineY = mathY + (fontSize * 0.45);
                        ctx.beginPath();
                        ctx.moveTo((size - textWidth) / 2, lineY);
                        ctx.lineTo((size + textWidth) / 2, lineY);
                        ctx.lineWidth = Math.max(3, fontSize * 0.06);
                        ctx.strokeStyle = COLOR_TEXT;
                        ctx.stroke();

                    } else {
                        // Gambar MathJax SVG
                        const pxWidth = imgElement.customWidth;
                        const pxHeight = imgElement.customHeight;
                        ctx.drawImage(imgElement, (size - pxWidth) / 2, mathY - pxHeight / 2, pxWidth, pxHeight);

                        // Gambar Garis Bawah untuk Rumus
                        const lineY = mathY + (pxHeight / 2) + (size * 0.04); 
                        const underlineWidth = pxWidth * 0.9;
                        ctx.beginPath();
                        ctx.moveTo((size - underlineWidth) / 2, lineY);
                        ctx.lineTo((size + underlineWidth) / 2, lineY);
                        ctx.lineWidth = Math.max(3, size * 0.012);
                        ctx.strokeStyle = COLOR_TEXT;
                        ctx.stroke();
                    }
                }
                canvasData.texture.needsUpdate = true;
            };

            if (!text || text.trim() === "") {
                renderFinal(null, true);
                return;
            }

            if (window.mathJaxReady) {
                window.MathJax.tex2svgPromise(text, {display: true}).then((node) => {
                    const svg = node.querySelector('svg');
                    if (!svg) { renderFinal(null, true); return; }

                    const viewBox = svg.getAttribute('viewBox').split(' ');
                    const vbWidth = parseFloat(viewBox[2]);
                    const vbHeight = parseFloat(viewBox[3]);

                    let pxWidth = vbWidth * 0.12;
                    let pxHeight = vbHeight * 0.12;

                    // Batasi ukuran agar tidak menabrak indeks sudut
                    const maxWidth = size * 0.55;
                    const maxHeight = size * 0.35;
                    const scale = Math.min(1, maxWidth / pxWidth, maxHeight / pxHeight);
                    pxWidth *= scale;
                    pxHeight *= scale;

                    svg.setAttribute('width', pxWidth + 'px');
                    svg.setAttribute('height', pxHeight + 'px');
                    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

                    let svgString = new XMLSerializer().serializeToString(svg);
                    svgString = svgString.replace(/currentColor/g, COLOR_TEXT); 

                    const img = new Image();
                    img.customWidth = pxWidth;
                    img.customHeight = pxHeight;
                    img.onload = () => renderFinal(img, false);
                    img.onerror = () => renderFinal(null, true);
                    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
                }).catch(() => {
                    renderFinal(null, true);
                });
            } else {
                renderFinal(null, true);
            }
        }

        function buildInputsForActiveDice() {
            INPUTS_CONTAINER.innerHTML = ''; // Bersihkan input lama
            const activeData = diceData[currentActiveTab];

            for (let i = 0; i < 20; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = "flex gap-2 items-center bg-slate-800/50 p-1.5 rounded border border-slate-700";
                
                const inputColor = document.createElement('input');
                inputColor.type = "color";
                inputColor.className = "w-7 h-7 shrink-0 cursor-pointer bg-slate-900 border border-slate-600 rounded p-0";
                inputColor.value = activeData[i].color;
                
                const inputLabel = document.createElement('input');
                inputLabel.type = "text";
                inputLabel.className = "w-9 shrink-0 bg-slate-900 border border-slate-600 rounded px-1 py-1 text-xs font-bold text-center text-slate-300 focus:outline-none focus:border-indigo-500 transition-all";
                inputLabel.value = activeData[i].label;
                
                const inputValue = document.createElement('input');
                inputValue.type = "text";
                inputValue.className = "flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500 transition-all min-w-0";
                inputValue.placeholder = "Nilai/LaTeX";
                inputValue.value = activeData[i].value;

                inputColor.addEventListener('input', (e) => {
                    activeData[i].color = e.target.value;
                    updateFace(currentActiveTab, i);
                });
                inputLabel.addEventListener('input', (e) => {
                    activeData[i].label = e.target.value;
                    updateFace(currentActiveTab, i);
                });
                inputValue.addEventListener('input', (e) => {
                    activeData[i].value = e.target.value;
                    updateFace(currentActiveTab, i);
                });

                wrapper.appendChild(inputColor);
                wrapper.appendChild(inputLabel);
                wrapper.appendChild(inputValue);
                INPUTS_CONTAINER.appendChild(wrapper);
            }
        }

        function initUI() {
            document.getElementById('btn-toggle-panel').addEventListener('click', () => {
                document.getElementById('left-panel').classList.toggle('hidden');
                setTimeout(onWindowResize, 10);
            });

            // Kontrol Jumlah Dadu
            const countBtns = document.querySelectorAll('.dice-count-btn');
            countBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    activeDiceCount = parseInt(e.target.dataset.count);
                    
                    // Update UI Button
                    countBtns.forEach(b => {
                        b.classList.remove('border-indigo-600', 'bg-indigo-600', 'text-white');
                        b.classList.add('border-slate-600', 'bg-slate-800', 'text-slate-400');
                    });
                    e.target.classList.remove('border-slate-600', 'bg-slate-800', 'text-slate-400');
                    e.target.classList.add('border-indigo-600', 'bg-indigo-600', 'text-white');

                    // Tampilkan/Sembunyikan Tab
                    document.getElementById('tab-dadu-2').style.display = activeDiceCount >= 2 ? 'block' : 'none';
                    document.getElementById('tab-dadu-3').style.display = activeDiceCount >= 3 ? 'block' : 'none';

                    // Jika tab aktif disembunyikan, kembali ke tab 1
                    if(currentActiveTab >= activeDiceCount) {
                        document.querySelector('.tab-btn[data-dice="0"]').click();
                    }

                    updateDiceCountLayout();
                });
            });

            // Kontrol Tab
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    tabs.forEach(t => {
                        t.classList.remove('active', 'bg-indigo-600', 'text-white');
                        t.classList.add('bg-slate-800', 'text-slate-400');
                    });
                    e.target.classList.remove('bg-slate-800', 'text-slate-400');
                    e.target.classList.add('active');
                    
                    currentActiveTab = parseInt(e.target.dataset.dice);
                    document.getElementById('active-dice-label').innerText = `Dadu ${currentActiveTab + 1}`;
                    buildInputsForActiveDice();
                });
            });

            // Toggle Indeks & Warna
            document.getElementById('toggle-index').addEventListener('change', (e) => {
                showIndex = e.target.checked;
                updateAllFaces();
            });
            document.getElementById('global-index-color').addEventListener('input', (e) => {
                globalIndexColor = e.target.value;
                updateAllFaces();
            });

            document.getElementById('speed-slider').addEventListener('input', (e) => {
                speedMultiplier = parseFloat(e.target.value);
                document.getElementById('speed-display').innerText = speedMultiplier.toFixed(1) + "x";
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                for(let i=0; i<20; i++) { diceData[currentActiveTab][i].value = ""; }
                buildInputsForActiveDice();
                for(let i=0; i<20; i++) updateFace(currentActiveTab, i);
            });
            document.getElementById('btn-number').addEventListener('click', () => {
                for(let i=0; i<20; i++) { diceData[currentActiveTab][i].value = (i+1).toString(); }
                buildInputsForActiveDice();
                for(let i=0; i<20; i++) updateFace(currentActiveTab, i);
            });
            document.getElementById('btn-letter').addEventListener('click', () => {
                for(let i=0; i<20; i++) { diceData[currentActiveTab][i].value = String.fromCharCode(65+i); }
                buildInputsForActiveDice();
                for(let i=0; i<20; i++) updateFace(currentActiveTab, i);
            });
            document.getElementById('btn-math').addEventListener('click', () => {
                const mathExamples = ["200","\\sqrt{64}","\\frac{1}{2}","x^2","y = mx+c","\\pi","\\alpha","\\beta","A = \\pi r^2","E=mc^2","\\sum_{n=1}^{10}","\\infty","a^2+b^2=c^2","50\\%","\\int x dx","1 \\frac{1}{2}","\\frac{x}{y}","x \\pm 1","\\Delta","10^3"];
                for(let i=0; i<20; i++) { diceData[currentActiveTab][i].value = mathExamples[i]; }
                buildInputsForActiveDice();
                for(let i=0; i<20; i++) updateFace(currentActiveTab, i);
            });
            document.getElementById('btn-random-color').addEventListener('click', () => {
                const distinctColors = ["#ef4444","#f97316","#f59e0b","#eab308","#84cc16","#22c55e","#10b981","#14b8a6","#06b6d4","#0ea5e9","#3b82f6","#6366f1","#8b5cf6","#a855f7","#d946ef","#ec4899","#f43f5e","#9f1239","#431407","#0f766e"];
                for (let i = distinctColors.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [distinctColors[i], distinctColors[j]] = [distinctColors[j], distinctColors[i]];
                }
                for(let i=0; i<20; i++) { diceData[currentActiveTab][i].color = distinctColors[i]; }
                buildInputsForActiveDice();
                for(let i=0; i<20; i++) updateFace(currentActiveTab, i);
            });

            const SAVE_KEY = 'mathIco_v3';
            const statusText = document.getElementById('save-status');
            const savedList = document.getElementById('saved-list');

            function showStatus(msg, colorClass) {
                statusText.innerText = msg;
                statusText.className = `text-[10px] text-center mt-1 ${colorClass} opacity-100 transition-opacity duration-300`;
                setTimeout(() => { statusText.classList.remove('opacity-100'); statusText.classList.add('opacity-0'); }, 3000);
            }

            function getSaves() { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); }

            function renderSaveList() {
                const saves = getSaves();
                savedList.innerHTML = '';
                const names = Object.keys(saves);
                if(names.length === 0) {
                    savedList.innerHTML = '<li class="text-[10px] text-slate-500 text-center italic py-1">Belum ada data</li>';
                    return;
                }
                names.forEach(name => {
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center bg-slate-800 p-1 rounded border border-slate-700 hover:border-slate-500";
                    const nBtn = document.createElement('button');
                    nBtn.className = "flex-1 text-left text-[11px] text-slate-300 font-medium truncate px-1";
                    nBtn.innerText = name;
                    nBtn.onclick = () => loadData(name);
                    const dBtn = document.createElement('button');
                    dBtn.className = "text-slate-500 hover:text-red-400 p-1 rounded text-[10px]";
                    dBtn.innerText = "🗑️";
                    dBtn.onclick = () => {
                        if(confirm(`Hapus "${name}"?`)){
                            const s = getSaves(); delete s[name];
                            localStorage.setItem(SAVE_KEY, JSON.stringify(s));
                            renderSaveList(); showStatus('Dihapus', 'text-red-400');
                        }
                    };
                    li.appendChild(nBtn); li.appendChild(dBtn);
                    savedList.appendChild(li);
                });
            }

            document.getElementById('btn-save').addEventListener('click', () => {
                const name = document.getElementById('input-save-name').value.trim();
                if(!name) return showStatus("Isi nama!", "text-amber-400");
                const saves = getSaves();
                saves[name] = { diceData, showIndex, globalIndexColor, activeDiceCount };
                localStorage.setItem(SAVE_KEY, JSON.stringify(saves));
                document.getElementById('input-save-name').value = '';
                renderSaveList(); showStatus(`Tersimpan`, "text-emerald-400");
            });

            function loadData(name) {
                const s = getSaves()[name];
                if(s) {
                    // Update Variables
                    diceData = s.diceData;
                    showIndex = s.showIndex;
                    globalIndexColor = s.globalIndexColor;
                    
                    // Update Toggles & Inputs
                    document.getElementById('toggle-index').checked = showIndex;
                    document.getElementById('global-index-color').value = globalIndexColor;
                    
                    // Trigger Button Dice Count setup
                    document.querySelector(`.dice-count-btn[data-count="${s.activeDiceCount || 1}"]`).click();
                    
                    buildInputsForActiveDice();
                    updateAllFaces();
                    showStatus(`Dimuat`, "text-indigo-400");
                }
            }
            renderSaveList();
            buildInputsForActiveDice();
        }

        function onWindowResize() {
            camera.aspect = CANVAS_CONTAINER.clientWidth / CANVAS_CONTAINER.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(CANVAS_CONTAINER.clientWidth, CANVAS_CONTAINER.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            diceMeshes.forEach((mesh, idx) => {
                // Rotasi individual ditambahkan dengan kecepatan global
                mesh.rotation.x += baseRotationSpeed.x * speedMultiplier;
                mesh.rotation.y += baseRotationSpeed.y * speedMultiplier;
                mesh.rotation.z += baseRotationSpeed.z * speedMultiplier;
            });
            controls.update();
            renderer.render(scene, camera);
        }

        // Jalankan
        init3D();
        initUI();
        animate();

    </script>
</body>
</html>
