<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dadu 3D Kustom Interaktif</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            user-select: none; /* Mencegah teks terblokir saat di-drag */
        }

        h1 {
            margin-bottom: 5px;
        }

        .hint {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Kontainer Utama Dadu 3D */
        .scene {
            width: 200px;
            height: 200px;
            perspective: 600px;
            margin: 40px auto;
            cursor: grab;
        }

        .scene:active {
            cursor: grabbing;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(-100px) rotateX(-20deg) rotateY(30deg); /* Posisi awal sedikit miring */
        }

        /* Pengaturan Sisi Dadu */
        .cube__face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid #333;
            line-height: 200px;
            font-size: 40px;
            font-weight: bold;
            color: white;
            text-align: center;
            background: rgba(52, 152, 219, 0.9);
            overflow: hidden;
            word-wrap: break-word;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        /* Posisi 3D masing-masing sisi */
        .cube__face--front  { transform: rotateY(  0deg) translateZ(100px); }
        .cube__face--back   { transform: rotateY(180deg) translateZ(100px); }
        .cube__face--right  { transform: rotateY( 90deg) translateZ(100px); }
        .cube__face--left   { transform: rotateY(-90deg) translateZ(100px); }
        .cube__face--top    { transform: rotateX( 90deg) translateZ(100px); }
        .cube__face--bottom { transform: rotateX(-90deg) translateZ(100px); }

        /* Form Input untuk Mengubah Isi Sisi */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            margin-top: 25px;
        }

        .input-group {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group input {
            padding: 5px;
            width: 65%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button.roll-btn {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }

        button.roll-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>🎲 Dadu 3D Kustom</h1>
    <p class="hint">💡 Klik dan geser (drag) di area sekitar dadu untuk memutarnya bebas!</p>

    <!-- Area 3D Dadu -->
    <div class="scene" id="scene">
        <div class="cube" id="dice">
            <div class="cube__face cube__face--front" id="face-1">1</div>
            <div class="cube__face cube__face--back" id="face-2">2</div>
            <div class="cube__face cube__face--right" id="face-3">3</div>
            <div class="cube__face cube__face--left" id="face-4">4</div>
            <div class="cube__face cube__face--top" id="face-5">5</div>
            <div class="cube__face cube__face--bottom" id="face-6">6</div>
        </div>
    </div>

    <!-- Kontrol Input -->
    <div class="controls">
        <h3>Ubah Text / Angka Sisi Dadu:</h3>
        <div class="input-group">
            <label>Sisi 1 (Depan):</label>
            <input type="text" value="1" oninput="updateFace(1, this.value)">
        </div>
        <div class="input-group">
            <label>Sisi 2 (Belakang):</label>
            <input type="text" value="2" oninput="updateFace(2, this.value)">
        </div>
        <div class="input-group">
            <label>Sisi 3 (Kanan):</label>
            <input type="text" value="3" oninput="updateFace(3, this.value)">
        </div>
        <div class="input-group">
            <label>Sisi 4 (Kiri):</label>
            <input type="text" value="4" oninput="updateFace(4, this.value)">
        </div>
        <div class="input-group">
            <label>Sisi 5 (Atas):</label>
            <input type="text" value="5" oninput="updateFace(5, this.value)">
        </div>
        <div class="input-group">
            <label>Sisi 6 (Bawah):</label>
            <input type="text" value="6" oninput="updateFace(6, this.value)">
        </div>

        <button class="roll-btn" onclick="rollDice()">Acak / Putar Otomatis</button>
    </div>

    <script>
        const dice = document.getElementById('dice');
        const scene = document.getElementById('scene');

        // Nilai rotasi awal
        let currentX = -20;
        let currentY = 30;
        
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        // Fungsi untuk langsung mengubah teks di sisi dadu
        function updateFace(faceNumber, value) {
            document.getElementById(`face-${faceNumber}`).innerText = value;
        }

        // --- Logika Geser / Drag Menggunakan Mouse & Touch ---
        function startDrag(e) {
            isDragging = true;
            // Mendukung mouse maupun touch screen (HP)
            const pageX = e.pageX || e.touches[0].pageX;
            const pageY = e.pageY || e.touches[0].pageY;
            
            previousMousePosition = { x: pageX, y: pageY };
            dice.style.transition = 'none'; // Matikan animasi transisi agar pergeseran terasa responsif
        }

        function doDrag(e) {
            if (!isDragging) return;

            const pageX = e.pageX || (e.touches ? e.touches[0].pageX : null);
            const pageY = e.pageY || (e.touches ? e.touches[0].pageY : null);
            if (!pageX || !pageY) return;

            const deltaMove = {
                x: pageX - previousMousePosition.x,
                y: pageY - previousMousePosition.y
            };

            // Hitung rotasi baru berdasarkan seberapa jauh mouse digerakkan
            // Memindahkan mouse ke kanan-kiri mengubah RotateY, ke atas-bawah mengubah RotateX
            currentY += deltaMove.x * 0.5;
            currentX -= deltaMove.y * 0.5;

            dice.style.transform = `translateZ(-100px) rotateX(${currentX}deg) rotateY(${currentY}deg)`;

            previousMousePosition = { x: pageX, y: pageY };
        }

        function endDrag() {
            isDragging = false;
        }

        // Event listener untuk mouse komputer
        scene.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', endDrag);

        // Event listener untuk layar sentuh HP
        scene.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', doDrag);
        window.addEventListener('touchend', endDrag);


        // Fungsi acak bawaan (jika malas menggeser secara manual)
        function rollDice() {
            dice.style.transition = 'transform 1s ease-out'; // Hidupkan kembali transisi halus
            
            // Berhenti pas di kelipatan 90 derajat agar sisinya menghadap layar dengan rapi
            currentX = Math.floor(Math.random() * 4) * 90 + 360;
            currentY = Math.floor(Math.random() * 4) * 90 + 360;

            dice.style.transform = `translateZ(-100px) rotateX(${currentX}deg) rotateY(${currentY}deg)`;
        }
    </script>

</body>
</html>
