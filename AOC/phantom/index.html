<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Fungsi f(x, y) = 6x² - x - xy</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Serif SC', 'Cinzel', serif;
            background: radial-gradient(circle at center, #4a0305 0%, #200002 70%, #0d0001 100%);
            min-height: 100vh;
        }

        /* Decorative Gold Frame & Patterns */
        .royal-card {
            background: radial-gradient(circle at center, #8a0c10 0%, #500406 60%, #300203 100%);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(0, 0, 0, 0.6);
            border: 4px solid #d4af37;
            position: relative;
        }

        /* Outer Double Frame Effect */
        .royal-card::before {
            content: '';
            position: absolute;
            top: -12px;
            left: -12px;
            right: -12px;
            bottom: -12px;
            border: 2px solid #b8860b;
            pointer-events: none;
            border-radius: 12px;
        }

        /* Gold Gradient Elements */
        .gold-gradient-text {
            background: linear-gradient(135deg, #fff7c2 0%, #ffd700 30%, #d4af37 70%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
        }

        .gold-gradient-bg {
            background: linear-gradient(135deg, #ffe066 0%, #d4af37 50%, #aa7c11 100%);
        }

        .gold-gradient-bg:hover {
            background: linear-gradient(135deg, #fff099 0%, #e6c200 50%, #c49215 100%);
        }

        .gold-border {
            border: 2px solid;
            border-image: linear-gradient(to bottom right, #ffe066, #d4af37, #8a640f) 1;
        }

        /* Input Styling */
        .custom-input {
            background: rgba(30, 2, 3, 0.85);
            border: 2px solid #b8860b;
            color: #fff7c2;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            background: rgba(45, 3, 5, 0.95);
        }

        /* SVG Corner Ornaments Position */
        .corner-ornament {
            position: absolute;
            width: 42px;
            height: 42px;
            fill: #d4af37;
            pointer-events: none;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.7));
        }
        .corner-tl { top: 6px; left: 6px; }
        .corner-tr { top: 6px; right: 6px; transform: scaleX(-1); }
        .corner-bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
        .corner-br { bottom: 6px; right: 6px; transform: scale(-1); }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-8">

    <!-- Main Container -->
    <div class="relative w-full max-w-xl p-6 md:p-10 rounded-lg royal-card text-amber-100">
        <!-- Asian Traditional Corner Ornaments (SVG) -->
        <svg class="corner-ornament corner-tl" viewBox="0 0 100 100">
            <path d="M0,0 L100,0 L100,20 L20,20 L20,100 L0,100 Z" fill="#d4af37"/>
            <path d="M25,25 L80,25 L80,40 L40,40 L40,80 L25,80 Z" fill="#ffd700"/>
            <circle cx="50" cy="50" r="8" fill="#d4af37"/>
        </svg>
        <svg class="corner-ornament corner-tr" viewBox="0 0 100 100">
            <path d="M0,0 L100,0 L100,20 L20,20 L20,100 L0,100 Z" fill="#d4af37"/>
            <path d="M25,25 L80,25 L80,40 L40,40 L40,80 L25,80 Z" fill="#ffd700"/>
            <circle cx="50" cy="50" r="8" fill="#d4af37"/>
        </svg>
        <svg class="corner-ornament corner-bl" viewBox="0 0 100 100">
            <path d="M0,0 L100,0 L100,20 L20,20 L20,100 L0,100 Z" fill="#d4af37"/>
            <path d="M25,25 L80,25 L80,40 L40,40 L40,80 L25,80 Z" fill="#ffd700"/>
            <circle cx="50" cy="50" r="8" fill="#d4af37"/>
        </svg>
        <svg class="corner-ornament corner-br" viewBox="0 0 100 100">
            <path d="M0,0 L100,0 L100,20 L20,20 L20,100 L0,100 Z" fill="#d4af37"/>
            <path d="M25,25 L80,25 L80,40 L40,40 L40,80 L25,80 Z" fill="#ffd700"/>
            <circle cx="50" cy="50" r="8" fill="#d4af37"/>
        </svg>

        <!-- Meander Border Decorative Header Pattern -->
        <div class="w-full h-3 border-y border-amber-500/40 mb-6 flex justify-between items-center overflow-hidden opacity-60">
            <div class="text-xs text-amber-300 tracking-[0.3em] whitespace-nowrap">
                卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐
            </div>
        </div>

        <!-- Header Title -->
        <div class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold gold-gradient-text tracking-wide mb-2" style="font-family: 'Cinzel Decorative', 'Cinzel', serif;">
                KALKULATOR FUNGSI
            </h1>
            <div class="inline-block px-4 py-1 rounded bg-black/40 border border-amber-500/50 shadow-inner">
                <span class="text-lg md:text-xl font-semibold text-amber-300 font-mono">f(x, y) = 6x² - x - xy</span>
            </div>
        </div>

        <!-- Input Form Section -->
        <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Input X -->
                <div class="flex flex-col">
                    <label for="valX" class="mb-2 text-sm font-semibold tracking-wider text-amber-200 flex items-center gap-2">
                        <span class="text-amber-400">❖</span> Nilai Variable X:
                    </label>
                    <input 
                        type="number" 
                        id="valX" 
                        placeholder="Masukkan nilai x" 
                        value="5" 
                        class="custom-input p-3 rounded text-center text-xl font-bold font-mono shadow-inner"
                        oninput="calculateResult()"
                    >
                </div>

                <!-- Input Y -->
                <div class="flex flex-col">
                    <label for="valY" class="mb-2 text-sm font-semibold tracking-wider text-amber-200 flex items-center gap-2">
                        <span class="text-amber-400">❖</span> Nilai Variable Y:
                    </label>
                    <input 
                        type="number" 
                        id="valY" 
                        placeholder="Masukkan nilai y" 
                        value="8" 
                        class="custom-input p-3 rounded text-center text-xl font-bold font-mono shadow-inner"
                        oninput="calculateResult()"
                    >
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-3 pt-2">
                <button 
                    onclick="calculateResult()" 
                    class="flex-1 min-w-[140px] py-3 px-6 gold-gradient-bg text-amber-950 font-bold text-lg rounded shadow-lg transform active:scale-95 transition-all duration-150 uppercase tracking-wider border border-amber-300 flex items-center justify-center gap-2"
                >
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14h-4v-2h4v2zm0-4h-4v-2h4v2zm0-4h-4V7h4v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2z"/></svg>
                    Hitung
                </button>
                <button 
                    onclick="resetForm()" 
                    class="py-3 px-5 bg-red-950 hover:bg-red-900 text-amber-300 font-semibold rounded border border-amber-600/50 transition-colors shadow flex items-center justify-center"
                    title="Reset Form"
                >
                    Reset
                </button>
            </div>

            <!-- Output & Calculation Details Section -->
            <div class="mt-8 p-5 bg-black/50 rounded-lg border-2 border-amber-500/60 shadow-inner">
                <div class="text-center">
                    <span class="text-xs uppercase tracking-widest text-amber-400/90 font-semibold block mb-1">Hasil Perhitungan</span>
                    <div id="resultOutput" class="text-4xl md:text-5xl font-extrabold gold-gradient-text font-mono my-2">
                        -
                    </div>
                </div>

                <!-- Step by step breakdown -->
                <div class="mt-4 pt-3 border-t border-amber-500/30 text-center font-mono text-sm text-amber-200/90 space-y-1">
                    <div id="step1" class="text-xs md:text-sm">-</div>
                    <div id="step2" class="text-xs md:text-sm text-amber-300/80">-</div>
                </div>
            </div>
        </div>

        <!-- Footer Accent Line -->
        <div class="w-full h-3 border-y border-amber-500/40 mt-8 flex justify-between items-center overflow-hidden opacity-60">
            <div class="text-xs text-amber-300 tracking-[0.3em] whitespace-nowrap">
                卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐 卍 卐
            </div>
        </div>
    </div>

    <!-- Interactive JavaScript -->
    <script>
        function calculateResult() {
            const xInput = document.getElementById('valX').value;
            const yInput = document.getElementById('valY').value;

            const resultOutput = document.getElementById('resultOutput');
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');

            // Validation check
            if (xInput === '' || yInput === '') {
                resultOutput.innerText = '-';
                step1.innerText = 'Masukkan nilai x dan y';
                step2.innerText = '';
                return;
            }

            const x = parseFloat(xInput);
            const y = parseFloat(yInput);

            // Calculation for f(x,y) = 6x^2 - x - xy
            const term1 = 6 * Math.pow(x, 2);   // 6x^2
            const term2 = x;                    // x
            const term3 = x * y;                // xy
            
            const result = term1 - term2 - term3;

            // Format numbers for display
            const formatNum = (num) => Number.isInteger(num) ? num : num.toFixed(2);

            // Update UI Output
            resultOutput.innerText = formatNum(result);
            step1.innerText = `f(${x}, ${y}) = 6(${x})² - (${x}) - (${x})(${y})`;
            step2.innerText = `= ${formatNum(term1)} - ${formatNum(term2)} - ${formatNum(term3)}`;
        }

        function resetForm() {
            document.getElementById('valX').value = '';
            document.getElementById('valY').value = '';
            calculateResult();
        }

        // Initialize on page load
        window.onload = function() {
            calculateResult();
        };
    </script>
</body>
</html>
